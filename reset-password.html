<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Northcrest patient portal</title>
  <meta name="description" content="Choose a new password for your Northcrest patient portal account.">
  <meta name="theme-color" content="#1E2A78">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('northcrest-theme');
        var d = localStorage.getItem('northcrest-dir');
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('dir', d === 'rtl' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&amp;family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/pages/reset-password.css">
  <script defer src="data/site-data.js"></script>
  <script defer src="js/validation.js"></script>
  <script defer src="js/site.js"></script>
  <script defer src="js/pages/reset-password.js"></script>
</head>
<body class="">
<main id="main" class="auth auth--single">
  <div class="auth-form-wrap"><div class="auth-form auth-simple">
    <div class="auth-brand"><a class="brand" href="index.html" aria-label="Northcrest Multispeciality Hospital, home">
          <svg class="brand-mark" viewBox="0 0 48 48" width="42" height="42" aria-hidden="true" focusable="false">
            <path class="mark-shield" d="M24 3 6 9.5v12.2C6 33.4 13.7 41.9 24 45c10.3-3.1 18-11.6 18-23.3V9.5z"/>
            <path class="mark-cross" d="M20.5 13.5h7v7h7v7h-7v7h-7v-7h-7v-7h7z"/>
          </svg>
          <span class="brand-text"><span class="brand-name">Northcrest</span><span class="brand-sub">Multispeciality Hospital</span></span>
        </a>
</div>
    <div class="auth-card">
      <div class="auth-head"><h1 id="auth-title">Choose a new password</h1><p class="sub">Use one you have not used before.</p></div>
      <div data-rp="form">
        <form class="form" data-validate novalidate data-no-reset id="rpForm">
          <div class="field"><label for="rp-pw">New password</label><div class="pw-wrap"><input id="rp-pw" name="new-password" type="password" autocomplete="new-password" data-rule="password" placeholder="At least 8 characters" required><button class="pw-toggle" type="button" data-pw-toggle aria-label="Show password">Show</button></div>
            <div class="pw-meter" id="pwMeter" aria-hidden="true"><span></span><span></span><span></span><span></span></div><p class="field-hint" id="pwHint" aria-live="polite">At least 8 characters, with a letter and a number.</p></div>
          <div class="field"><label for="rp-pw2">Confirm new password</label><div class="pw-wrap"><input id="rp-pw2" name="confirm-password" type="password" autocomplete="new-password" data-rule="password" data-match="#rp-pw" placeholder="Repeat the password" required><button class="pw-toggle" type="button" data-pw-toggle aria-label="Show password">Show</button></div></div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Save new password</button>
        </form>
      </div>
      <div data-rp="done" hidden>
        <p class="form-success" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span>Password changed. For your safety, other devices have been signed out.</span></p>
        <div class="auth-actions"><a class="btn btn-primary btn-block" href="login.html">Log in with the new password</a></div>
      </div>
      <p class="auth-back"><a class="link" href="forgot-password.html">Link expired? Request a new one</a></p>
    </div>
  </div></div>
</main>
</body>
</html>
